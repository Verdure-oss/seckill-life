server:
  port: 8084
spring:
  application:
    name: hmdp
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-3.5-turbo
    base-url: https://api.openai.com/v1