server:
  port: 8084
spring:
  application:
    name: hmdp
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 消费异常重试 3 次，耗尽后拒绝且不重新入队（配合队列的死信交换机进入 DLQ）
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 5000
        default-requeue-rejected: false
bloom:
  warmup:
    enabled: true # 服务启动时预热布隆过滤器
cache:
  double-delete:
    enabled: true  # 缓存一致性：延迟双删
    delay-ms: 500  # 延迟二次删除间隔
hmdp:
  upload-dir: 'E:\software\nginx-1.18.0\html\hmdp\imgs\' # 图片上传目录（Linux 环境改为 nginx 部署路径）
canal:
  enabled: false      # 标准版缓存一致性：binlog 订阅（需先部署 Canal Server，见 docs/canal-deploy.md）
  host: 127.0.0.1     # Canal Server 地址
  port: 11111         # Canal Server 端口
  destination: example
  batch-size: 100     # 单批拉取条数
  connect-retry-interval-ms: 5000  # 连接失败重试间隔
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

ai:
  openai:
    enabled: false  # Set to true in production to enable AI features
    api-key: ${OPENAI_API_KEY:}
    model: gpt-3.5-turbo
    base-url: https://api.openai.com/v1