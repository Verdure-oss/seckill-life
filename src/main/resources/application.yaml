server:
  port: 8084
spring:
  application:
    name: hmdp
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # 消费异常重试 3 次，耗尽后拒绝且不重新入队（配合队列的死信交换机进入 DLQ）
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 5000
        default-requeue-rejected: false
bloom:
  warmup:
    enabled: true # 服务启动时预热布隆过滤器
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

ai:
  openai:
    enabled: false  # Set to true in production to enable AI features
    api-key: ${OPENAI_API_KEY:}
    model: gpt-3.5-turbo
    base-url: https://api.openai.com/v1