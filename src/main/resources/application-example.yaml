# 配置模板示例：复制为 application-local.yaml 并按本地环境修改真实密码。
# 禁止把含真实凭据的配置文件提交或推送到远程仓库。
spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: <your-mysql-username>
    password: <your-mysql-password>
  redis:
    host: 127.0.0.1
    port: 6379
    password: <your-redis-password>
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

# 图片上传目录（Linux 环境请改为 nginx/静态资源部署路径）
hmdp:
  upload-dir: 'E:\software\nginx-1.18.0\html\hmdp\imgs\'

# Canal 缓存同步（标准版缓存一致性）：默认关闭；开启需部署 Canal Server，步骤见 docs/canal-deploy.md
canal:
  enabled: false
  host: 127.0.0.1
  port: 11111
  destination: example
  batch-size: 100
  connect-retry-interval-ms: 5000