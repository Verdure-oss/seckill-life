name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: hmdp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --requirepass ci-test-password
          --health-cmd="redis-cli -a ci-test-password ping 2>/dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Init hmdp DB schema and seed data
        run: mysql -h 127.0.0.1 -P 3306 -uroot -pci-test-password hmdp < src/main/resources/db/hmdp.sql

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-test-password
          SPRING_REDIS_HOST: 127.0.0.1
          SPRING_REDIS_PORT: "6379"
          SPRING_REDIS_PASSWORD: ci-test-password
        run: ./mvnw test