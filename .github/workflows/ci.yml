name: CI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_DATABASE: hmdp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping 2>/dev/null"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Init hmdp DB schema and seed data
        run: |
          # 本 SQL 使用 '0000-00-00 00:00:00' 作为 timestamp 默认值，
          # 需放宽 sql_mode（去掉 NO_ZERO_DATE/NO_ZERO_IN_DATE）才能导入
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-test-password -e "SET GLOBAL sql_mode=''"
          mysql -h 127.0.0.1 -P 3306 -uroot -pci-test-password hmdp < src/main/resources/db/hmdp.sql

      - name: Run tests
        env:
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.jdbc.Driver
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-test-password
          SPRING_REDIS_HOST: 127.0.0.1
          SPRING_REDIS_PORT: "6379"
        run: ./mvnw test